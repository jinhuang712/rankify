[project]
name = "rankify"
version = "0.1.0"
description = "Rank lists with a few decisive rounds, fitted with Bradley-Terry / Plackett-Luce."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "textual>=8.2.8",
    "typer>=0.27.3",
]

[project.scripts]
rankify = "rankify.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rankify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["perf: timing tests against the latency budget"]

[tool.ruff]
line-length = 100
extend-exclude = ["experiments"]  # one-off analysis scripts, kept as run

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "choix>=0.4.1",
    "glicko2>=2.1.0",
    "hypothesis>=6.169.0",
    "openskill>=6.2.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "trueskill>=0.4.5",
]
